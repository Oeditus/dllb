[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/document",
    "crates/graph",
    "crates/search",
    "crates/vector",
    "crates/code-intel",
    "crates/query",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"
authors = ["Aleksei Matiushkin <am@mudasobwa.ru>"]
description = "dllb -- a multi-model NoSQL DBMS with native graphs, documents, full-text search, and vector embeddings"
repository = "https://github.com/Oeditus/dllb"
homepage = "https://github.com/Oeditus/dllb"
readme = "README.md"

[workspace.dependencies]
# Internal crates
dllb-core = { path = "crates/core", version = "1.2.0" }
dllb-storage = { path = "crates/storage", version = "1.2.0" }
dllb-document = { path = "crates/document", version = "1.2.0" }
dllb-graph = { path = "crates/graph", version = "1.2.0" }
dllb-search = { path = "crates/search", version = "1.2.0" }
dllb-vector = { path = "crates/vector", version = "1.2.0" }
dllb-code-intel = { path = "crates/code-intel", version = "1.2.0" }
dllb-query = { path = "crates/query", version = "1.2.0" }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rmp-serde = "1.3.1"

# Storage
redb = "4.6.0"

# Full-text search
tantivy = "0.27.0"

# Actor system
joerl = { version = "0.8.0", features = ["telemetry"] }
async-trait = "0.1.92"

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# Utilities
# Cache & Utilities
lru = "0.19.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
bytes = "1.12.2"
crc32fast = "1.5.5"
crossbeam = "0.8.5"
rayon = "1.12.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
half = { version = "2.7.1", features = ["serde"] }
rustyline = "19.0.0"
marcli = { version = "0.2.0" }
criterion = { version = "0.8.2", features = ["html_reports"] }
tikv-jemallocator = "0.7.0"

# [patch.crates-io]
# redb = { path = "crates/redb-4.1.0" }
